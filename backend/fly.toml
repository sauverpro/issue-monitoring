# fly.toml — Fly.io configuration for issue-monitoring backend
# Replace "issue-monitoring-api" with your actual Fly app name (must be globally unique)
# Run: fly launch --no-deploy   to generate an app name, then fly deploy

app = "issue-monitoring-api"
primary_region = "iad"      # change to nearest region: cdg=Paris, jnb=Johannesburg, etc.

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT     = "3000"

# SSE (Server-Sent Events) needs long-lived connections — raise timeouts accordingly
[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = true
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

# Health check — maps to GET /health in index.ts
[[http_service.checks]]
  grace_period  = "10s"
  interval      = "30s"
  method        = "GET"
  timeout       = "5s"
  path          = "/health"

# Free tier: 1 shared-cpu-1x with 256 MB RAM
[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
