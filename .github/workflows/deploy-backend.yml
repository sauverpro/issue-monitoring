# ────────────────────────────────────────────────────────────────────────────────
# Deploy Backend to VPS
# ────────────────────────────────────────────────────────────────────────────────
# Triggers on push to main (backend changes only) or manual dispatch.
# SSHs into your VPS and runs the deploy sequence.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST          – Server IP or hostname (e.g. 192.168.1.100)
#   VPS_USER          – SSH user on the server (e.g. deploy)
#   VPS_SSH_KEY       – Private SSH key (ed25519 or RSA) for VPS_USER
#   VPS_PORT          – SSH port (default: 22)
#   DEPLOY_PATH       – Absolute path to the project on the server
#                       (e.g. /home/deploy/apps/issue-monitoring)
# ────────────────────────────────────────────────────────────────────────────────

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# Prevent concurrent deploys
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # ── Job 1: Build & Test in CI ────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Run tests
        working-directory: backend
        run: npm test

  # ── Job 2: Deploy to VPS via SSH ─────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            echo "══════════════════════════════════════════════════"
            echo "🚀 Deploying issue-monitoring backend..."
            echo "   Directory: $DEPLOY_DIR"
            echo "   Time:      $(date)"
            echo "══════════════════════════════════════════════════"

            cd "$DEPLOY_DIR"

            # ── Pull latest code ──────────────────────────────────
            echo ""
            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # ── Install dependencies ──────────────────────────────
            echo ""
            echo "📦 Installing dependencies..."
            cd backend
            npm ci --production=false 

            # ── Run database migrations ───────────────────────────
            echo ""
            echo "🗄️  Running database migrations..."
            npx tsx scripts/migrate.ts

            # ── Build TypeScript ──────────────────────────────────
            echo ""
            echo "🔨 Building TypeScript..."
            npm run build

            # ── Reload PM2 (zero-downtime) ────────────────────────
            echo ""
            echo "♻️  Reloading PM2 process..."
            pm2 reload issue-monitor-api || pm2 start ecosystem.config.cjs

            # ── Health check ──────────────────────────────────────
            echo ""
            echo "🏥 Running health check..."
            sleep 3
            HEALTH=$(curl -sf http://localhost:3002/health || echo "FAILED")
            echo "   Health response: $HEALTH"

            if echo "$HEALTH" | grep -q '"ok":true'; then
              echo ""
              echo "✅ Deployment successful!"
            else
              echo ""
              echo "❌ Health check failed! Rolling back..."
              pm2 logs issue-monitor-api --lines 20 --nostream
              exit 1
            fi

            echo ""
            pm2 status
            echo ""
            echo "══════════════════════════════════════════════════"
            echo "🎉 Deploy complete at $(date)"
            echo "══════════════════════════════════════════════════"
