name: Publish Monitor SDK

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@koralink"
      - run: npm ci
      - run: npm run pack:sdk
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish --workspace @koralink/monitor-core --access restricted
          npm publish --workspace @koralink/monitor-web --access restricted
          npm publish --workspace @koralink/monitor-react-native --access restricted
      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: sdk-tarballs
          path: packages/releases/*.tgz
